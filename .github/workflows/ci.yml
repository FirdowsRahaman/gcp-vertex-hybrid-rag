name: GCP Vertex Hybrid RAG CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install ruff bandit pytest fastapi pydantic httpx
      - name: Lint & Security Scan
        run: |
          ruff check src tests
          bandit -r src -ll -ii
      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests -v
